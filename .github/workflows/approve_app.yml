name: Approve App Suggestion

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

# Permissions required to commit data, manage issues, and trigger workflows
permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: approve-app
  cancel-in-progress: false

jobs:
  approve:
    name: Approve and Ingest App
    runs-on: ubuntu-latest
    # Only allow repository owner or collaborators to approve
    if: >
      (github.event_name == 'issue_comment' &&
       (github.actor == github.repository_owner ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (contains(github.event.comment.body, '/approve') ||
        contains(github.event.comment.body, '/add'))) ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved')
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Register App Suggestion
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python scripts/approve_suggestion.py

      - name: Commit Community Catalog Update
        run: |
          git config user.name "sourceshelf-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/community_apps.json
          if git diff --staged --quiet; then
            echo "No new app to commit"
          else
            git commit -m "feat(catalog): approve ${{ steps.parse.outputs.repo }} from issue #${{ github.event.issue.number }}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Comment and Close Issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const repo = process.env.APPROVED_REPO || "The suggested app";
            const cat = process.env.APPROVED_CAT || "catalog";
            const comment = `🎉 **Suggestion Approved!**\n\n**${repo}** has been added to SourceShelf under **${cat}**!\n\nThe refresh pipeline has been triggered and it will appear on the site under **New arrivals** shortly. Thank you for your contribution! 🚀`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
        env:
          APPROVED_REPO: ${{ steps.parse.outputs.repo }}
          APPROVED_CAT: ${{ steps.parse.outputs.category }}

      - name: Trigger Refresh Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Refresh catalog & deploy workflow..."
          gh workflow run refresh.yml -R "${{ github.repository }}" || echo "Workflow trigger queued"
