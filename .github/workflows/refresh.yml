name: Refresh catalog & deploy

# Runs every 6h (03:17, 09:17, 15:17, 21:17 UTC) to prevent GitHub Actions cron queue drop,
# plus push to main (code updates) and manual triggers.
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      min_stars:
        description: "Minimum GitHub stars"
        default: "400"
        required: false
      releases:
        description: "How many repos to resolve download links for"
        default: "900"
        required: false
      resync_all:
        description: "Re-resolve download links for everything (slow)"
        type: boolean
        default: false
  repository_dispatch:
    types: [refresh]
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/refresh.yml"

# Least privilege: default to none at workflow level; grant only needed per job.
permissions: {}

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ crawl
  refresh:
    name: Crawl → build → publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write      # commit the refreshed dataset
      pages: write         # publish to GitHub Pages
      id-token: write      # required by deploy-pages / artifact attestations
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      new_today: ${{ steps.build.outputs.new_today }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # The crawler and storage layer are stdlib-only on purpose, so this
          # is just a sanity check that nothing unexpected crept in.
          python -m pip install --upgrade pip
          python - <<'PY'
          import importlib.util, sys
          missing = [m for m in ("urllib.request", "json", "sqlite3", "xml")
                     if importlib.util.find_spec(m) is None]
          print("stdlib ok" if not missing else f"missing: {missing}")
          sys.exit(1 if missing else 0)
          PY

      - name: Crawl GitHub
        env:
          # Built-in token: 5,000 core + 30 search requests/hour. No setup needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INPUT_MIN_STARS: ${{ github.event.inputs.min_stars }}
          INPUT_RELEASES: ${{ github.event.inputs.releases }}
          INPUT_RESYNC_ALL: ${{ github.event.inputs.resync_all }}
        run: |
          set -o pipefail
          MIN_STARS="${INPUT_MIN_STARS:-400}"
          if [ "$INPUT_RESYNC_ALL" = "true" ]; then
            RELEASES=2500
          else
            RELEASES="${INPUT_RELEASES:-900}"
          fi
          echo "crawling: min-stars=$MIN_STARS releases=$RELEASES"
          python scripts/fetch_apps.py \
            --force \
            --min-stars "$MIN_STARS" \
            --releases "$RELEASES" | tee crawl.log
          echo "---- summary ----"
          tail -6 crawl.log

      - name: Build site
        id: build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python scripts/build_single.py | tee build.log
          NEW=$(python -c "import json;print(json.load(open('data/apps.json'))['meta'].get('newToday',0))")
          COUNT=$(python -c "import json;print(json.load(open('data/apps.json'))['meta']['count'])")
          echo "new_today=$NEW" >> "$GITHUB_OUTPUT"
          {
            echo "### SourceShelf refresh"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Apps in catalog | **$COUNT** |"
            echo "| New today | **+$NEW** |"
            echo "| Download links | $(python -c "import json;print(json.load(open('data/apps.json'))['meta'].get('withDownloads',0))") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify build
        run: python scripts/selftest.py || (echo "::warning::self test reported problems"; exit 0)

      - name: Check build for secrets
        run: python scripts/build_single.py --check-secrets

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "sourceshelf-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage ALL generated output (data/, dist/, any stray crawl artefacts).
          # Using -A ensures the working tree is clean before we attempt a rebase.
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes today."
          else
            git commit -m "chore(data): refresh catalog $(date -u +%Y-%m-%d) [+${{ steps.build.outputs.new_today }} new]"
            # Rebase on top of any commits that landed on origin/main while we
            # were running (the working tree is clean at this point, so rebase
            # will never fail with "unstaged changes").
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  # ----------------------------------------------------------------- deploy
  deploy:
    name: Deploy to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
